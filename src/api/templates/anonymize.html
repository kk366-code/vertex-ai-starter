<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>テキスト匿名化</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-slate-50 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
      <h1 class="text-2xl font-bold text-center text-slate-800 mb-1">🔒 テキスト匿名化</h1>
      <p class="text-center text-slate-500 text-sm mb-8">
        テキスト中の個人情報・機密情報をAIで自動検出し、プレースホルダーに置き換えます
      </p>

      <!-- API Key -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">API Key</label>
        <div class="flex gap-2">
          <input
            id="api-key-input"
            type="password"
            placeholder="INTERNAL_API_KEY を入力"
            class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400"
          />
          <button
            onclick="saveApiKey()"
            class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition-colors"
          >
            保存
          </button>
        </div>
        <p id="api-key-status" class="text-xs text-slate-400 mt-1"></p>
      </div>

      <!-- 入力フォーム -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
        <h2 class="font-semibold text-slate-800 mb-3">匿名化対象テキスト</h2>
        <textarea
          id="input-text"
          rows="10"
          placeholder="例: 山田太郎（yamada@example.com）は株式会社ABCに勤務しており、東京都渋谷区1-2-3に在住。電話番号は090-1234-5678。"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 resize-none mb-4"
        ></textarea>

        <div class="flex gap-3">
          <button
            onclick="runAnonymize()"
            id="run-btn"
            class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition-colors"
          >
            匿名化を実行
          </button>
          <button
            onclick="runCompare()"
            id="compare-btn"
            class="flex-1 bg-blue-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition-colors"
          >
            手法を比較する
          </button>
        </div>

        <!-- Progress -->
        <div id="progress" class="hidden mt-3 flex items-center gap-2 text-sm text-emerald-600">
          <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span id="progress-label">AIが個人情報を検出・置換中...</span>
        </div>
      </div>

      <!-- エラー -->
      <div id="error-box" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-sm text-red-700"></div>

      <!-- 単体実行 結果 -->
      <div id="result-section" class="hidden space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-semibold text-slate-800">匿名化済みテキスト</h2>
            <button
              onclick="copyAnonymized()"
              class="text-xs text-emerald-600 border border-emerald-300 px-3 py-1 rounded-lg hover:bg-emerald-50 transition-colors"
            >
              コピー
            </button>
          </div>
          <div
            id="anonymized-text"
            class="bg-slate-50 rounded-lg px-4 py-3 text-sm text-slate-700 whitespace-pre-wrap leading-relaxed"
          ></div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
          <h2 class="font-semibold text-slate-800 mb-3">検出された個人・機密情報</h2>
          <div id="entities-empty" class="hidden text-sm text-slate-400">個人情報は検出されませんでした。</div>
          <div id="entities-table-wrap" class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-slate-100">
                  <th class="text-left font-medium text-slate-500 pb-2 pr-4">元の文字列</th>
                  <th class="text-left font-medium text-slate-500 pb-2 pr-4">カテゴリ</th>
                  <th class="text-left font-medium text-slate-500 pb-2">置換後</th>
                </tr>
              </thead>
              <tbody id="entities-body" class="divide-y divide-slate-50"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 比較結果 -->
      <div id="compare-section" class="hidden space-y-4">
        <h2 class="font-semibold text-slate-700 text-lg">手法別 比較結果</h2>
        <div id="compare-cards"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
      const CATEGORY_BADGE = {
        person: "bg-blue-100 text-blue-700",
        company: "bg-emerald-100 text-emerald-700",
        email: "bg-purple-100 text-purple-700",
        phone: "bg-orange-100 text-orange-700",
        address: "bg-red-100 text-red-700",
        other: "bg-slate-100 text-slate-600",
      };
      const CATEGORY_LABEL = {
        person: "人名",
        company: "会社名",
        email: "メール",
        phone: "電話番号",
        address: "住所",
        other: "その他",
      };

      function saveApiKey() {
        const key = document.getElementById("api-key-input").value.trim();
        if (!key) return;
        localStorage.setItem("anonymize_api_key", key);
        document.getElementById("api-key-status").textContent = "✓ 保存しました";
      }

      function getApiKey() {
        return localStorage.getItem("anonymize_api_key") || "";
      }

      function showToast(msg, isError = false) {
        const el = document.createElement("div");
        el.className = `px-4 py-2 rounded-lg text-sm text-white shadow ${isError ? "bg-red-500" : "bg-slate-700"}`;
        el.textContent = msg;
        document.getElementById("toast-container").appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      function setLoading(isLoading, label = "AIが個人情報を検出・置換中...") {
        document.getElementById("run-btn").disabled = isLoading;
        document.getElementById("compare-btn").disabled = isLoading;
        document.getElementById("progress-label").textContent = label;
        document.getElementById("progress").classList.toggle("hidden", !isLoading);
        document.getElementById("error-box").classList.add("hidden");
      }

      async function runAnonymize() {
        const text = document.getElementById("input-text").value.trim();
        const apiKey = getApiKey();
        if (!text) return showToast("テキストを入力してください", true);
        if (!apiKey) return showToast("API Key を入力・保存してください", true);

        setLoading(true);
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("compare-section").classList.add("hidden");

        try {
          const res = await fetch("/anonymize/text", {
            method: "POST",
            headers: { "X-API-KEY": apiKey, "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
          }
          renderResult(await res.json());
        } catch (e) {
          const box = document.getElementById("error-box");
          box.textContent = `エラー: ${e.message}`;
          box.classList.remove("hidden");
        } finally {
          setLoading(false);
        }
      }

      async function runCompare() {
        const text = document.getElementById("input-text").value.trim();
        const apiKey = getApiKey();
        if (!text) return showToast("テキストを入力してください", true);
        if (!apiKey) return showToast("API Key を入力・保存してください", true);

        setLoading(true, "複数の手法で並列処理中...");
        document.getElementById("result-section").classList.add("hidden");
        document.getElementById("compare-section").classList.add("hidden");

        try {
          const res = await fetch("/anonymize/compare", {
            method: "POST",
            headers: { "X-API-KEY": apiKey, "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
          }
          renderCompare(await res.json());
        } catch (e) {
          const box = document.getElementById("error-box");
          box.textContent = `エラー: ${e.message}`;
          box.classList.remove("hidden");
        } finally {
          setLoading(false);
        }
      }

      function renderResult(data) {
        document.getElementById("anonymized-text").textContent = data.anonymized_text;
        const body = document.getElementById("entities-body");
        body.innerHTML = "";
        if (!data.entities || data.entities.length === 0) {
          document.getElementById("entities-empty").classList.remove("hidden");
          document.getElementById("entities-table-wrap").classList.add("hidden");
        } else {
          document.getElementById("entities-empty").classList.add("hidden");
          document.getElementById("entities-table-wrap").classList.remove("hidden");
          for (const entity of data.entities) {
            body.appendChild(buildEntityRow(entity));
          }
        }
        document.getElementById("result-section").classList.remove("hidden");
      }

      function renderCompare(data) {
        const container = document.getElementById("compare-cards");
        container.innerHTML = "";
        for (const result of data.results) {
          const card = document.createElement("div");
          card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-4";

          const header = `
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                <h3 class="font-semibold text-slate-800">${escapeHtml(result.label)}</h3>
                <span class="text-xs text-slate-400">${result.duration_ms} ms</span>
              </div>
            </div>`;

          if (result.error) {
            card.innerHTML = header + `
              <div class="bg-red-50 border border-red-100 rounded-lg px-4 py-3 text-sm text-red-600">
                ${escapeHtml(result.error)}
              </div>`;
          } else {
            const entityRows = (result.entities || []).map(buildEntityRow);
            const entityHtml = entityRows.length === 0
              ? `<p class="text-xs text-slate-400">検出なし</p>`
              : `<table class="w-full text-xs mt-3">
                  <thead><tr class="border-b border-slate-100">
                    <th class="text-left font-medium text-slate-400 pb-1 pr-3">元の文字列</th>
                    <th class="text-left font-medium text-slate-400 pb-1 pr-3">カテゴリ</th>
                    <th class="text-left font-medium text-slate-400 pb-1">置換後</th>
                  </tr></thead>
                  <tbody class="divide-y divide-slate-50">${entityRows.map((r) => r.outerHTML).join("")}</tbody>
                </table>`;

            card.innerHTML = header + `
              <div class="bg-slate-50 rounded-lg px-4 py-3 text-sm text-slate-700 whitespace-pre-wrap leading-relaxed mb-3">
                ${escapeHtml(result.anonymized_text)}
              </div>
              <details class="text-sm">
                <summary class="cursor-pointer text-slate-500 hover:text-slate-700 select-none">
                  検出エンティティ（${result.entities.length}件）
                </summary>
                ${entityHtml}
              </details>`;
          }
          container.appendChild(card);
        }
        document.getElementById("compare-section").classList.remove("hidden");
      }

      function buildEntityRow(entity) {
        const badgeClass = CATEGORY_BADGE[entity.category] || CATEGORY_BADGE.other;
        const label = CATEGORY_LABEL[entity.category] || entity.category;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="py-1.5 pr-4 text-slate-700">${escapeHtml(entity.original)}</td>
          <td class="py-1.5 pr-4">
            <span class="inline-block text-xs font-medium px-2 py-0.5 rounded-full ${badgeClass}">${label}</span>
          </td>
          <td class="py-1.5 text-slate-500">${escapeHtml(entity.replacement)}</td>`;
        return tr;
      }

      async function copyAnonymized() {
        const text = document.getElementById("anonymized-text").textContent;
        await navigator.clipboard.writeText(text);
        showToast("コピーしました");
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      window.addEventListener("load", () => {
        const saved = getApiKey();
        if (saved) {
          document.getElementById("api-key-input").value = saved;
          document.getElementById("api-key-status").textContent = "✓ 保存済み";
        }
      });
    </script>
  </body>
</html>
